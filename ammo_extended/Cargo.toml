[package]
name = "ammo_extended"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
1_151 = []
1_163 = []

[build]
target = "x86_64-pc-windows-msvc"

[dependencies]
highfleet = { path = "../highfleet-rs" }
highfleet-mod-api = { git = "https://github.com/logdot/Highfleet-Modloader.git" }
serde = { version = "1.0.175", features = ["derive"] }
serde_json = "1.0.103"
log = "0.4.*"

patchy = { package = "patchy-rs", git = "https://github.com/logdot/patchy-rs.git", tag = "v0.1.0" }
